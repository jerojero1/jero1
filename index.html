<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JERO</title>
    <!-- Tailwind CSSを読み込む -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Interフォントを読み込む */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl text-center max-w-sm w-full border border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">サイトへ移動</h1>
<!-- この部分はブラウザに反映されません
        <p class="text-gray-600 mb-8">以下のボタンをクリックすると、新しいタブで指定されたサイトが開きます。</p> -->
        <div class="space-y-4">
            <button id="openYahooButton" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 w-full">
                Yahoo! JAPAN
            </button>
            <button id="openGoogleButton" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-75 w-full">
                Google
            </button>
            <button id="openYouTubeButton" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-75 w-full">
                YouTube
            </button>
            <button id="openGeminiButton" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-75 w-full">
                Gemini
            </button>
            <button id="openChatGPTButton" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-700 focus:ring-opacity-75 w-full">
                ChatGPT
            </button>
        </div>
    </div>

    <script>
        // Yahooボタン要素を取得
        const openYahooButton = document.getElementById('openYahooButton');
        // Googleボタン要素を取得
        const openGoogleButton = document.getElementById('openGoogleButton');
        // YouTubeボタン要素を取得
        const openYouTubeButton = document.getElementById('openYouTubeButton');
        // Geminiボタン要素を取得
        const openGeminiButton = document.getElementById('openGeminiButton');
        // ChatGPTボタン要素を取得
        const openChatGPTButton = document.getElementById('openChatGPTButton');

        // Yahooボタンがクリックされたときのイベントリスナーを追加
        openYahooButton.addEventListener('click', () => {
            // yahoo.co.jpを新しいタブで開く
            window.open('https://www.yahoo.co.jp', '_blank');
        });

        // Googleボタンがクリックされたときのイベントリスナーを追加
        openGoogleButton.addEventListener('click', () => {
            // google.comを新しいタブで開く
            window.open('https://www.google.com/', '_blank');
        });

        // YouTubeボタンがクリックされたときのイベントリスナーを追加
        openYouTubeButton.addEventListener('click', () => {
            // youtube.comを新しいタブで開く
            window.open('https://www.youtube.com/', '_blank');
        });

        // Geminiボタンがクリックされたときのイベントリスナーを追加
        openGeminiButton.addEventListener('click', () => {
            // gemini.google.comを新しいタブで開く
            window.open('https://gemini.google.com/', '_blank');
        });

        // ChatGPTボタンがクリックされたときのイベントリスナーを追加
        openChatGPTButton.addEventListener('click', () => {
            // chat.openai.comを新しいタブで開く
            window.open('https://chat.openai.com/', '_blank');
        });
    </script>
</body>
</html>
